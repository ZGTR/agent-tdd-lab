services:
  worker:
    build: .
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    init: true
    stop_grace_period: 60s
    mem_limit: 512m
    cpus: 0.25
    pids_limit: 64
    volumes:
      - agent-data:/data
volumes:
  agent-data:
