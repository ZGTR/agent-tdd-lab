name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra bedrock
      - run: uv run --frozen --extra bedrock ruff check .
      - run: uv run --frozen --extra bedrock ruff format --check .
      - run: uv run --frozen --extra bedrock mypy
      - run: uv run --frozen --extra bedrock python scripts/verify_mutation.py
      - run: uv run --frozen --extra bedrock pytest --cov --cov-report=term-missing --cov-report=xml
      - run: uv run --frozen --extra bedrock python -m build --no-isolation
      - run: uv run --frozen --extra bedrock agent-tdd evaluate --cases evals/refund-routing.json --provider scripted --report artifacts/smoke.json --repeats 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/install_tofu.py --directory "$RUNNER_TEMP/tofu"
      - run: echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      - run: tofu -chdir=infra/aws fmt -check -recursive
      - run: tofu -chdir=infra/aws init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/aws validate
      - run: tofu -chdir=infra/aws test

  container:
    strategy:
      matrix:
        bedrock: ['false', 'true']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: docker build --build-arg WITH_BEDROCK=${{ matrix.bedrock }} -t agent-tdd:ci .
      - run: python scripts/check_container.py agent-tdd:ci
      - if: matrix.bedrock == 'true'
        run: docker run --rm --read-only --network none --entrypoint python agent-tdd:ci -c "import boto3; assert boto3.__version__ == '1.43.8'"
