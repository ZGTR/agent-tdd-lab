name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra bedrock
      - run: uv run --frozen --extra bedrock ruff check .
      - run: uv run --frozen --extra bedrock ruff format --check .
      - run: uv run --frozen --extra bedrock mypy
      - run: uv run --frozen --extra bedrock python scripts/verify_mutation.py
      - run: uv run --frozen --extra bedrock python -c "import subprocess,sys; subprocess.run([sys.executable,'-m','pytest','-vv','-o','faulthandler_timeout=30','--durations=10','--cov','--cov-report=term-missing','--cov-report=xml'],check=True,timeout=120)"
      - run: uv run --frozen --extra bedrock python -m build --no-isolation
      - run: uv run --frozen --extra bedrock agent-tdd evaluate --cases evals/refund-routing.json --provider scripted --report artifacts/smoke.json --repeats 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/install_tofu.py --directory "$RUNNER_TEMP/tofu"
      - run: echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      - run: tofu -chdir=infra/aws fmt -check -recursive
      - run: tofu -chdir=infra/aws init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/aws validate
      - run: tofu -chdir=infra/aws test

  consumer-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Gate a Node application through the public action
        uses: ./
        with:
          cases: evals/ci-echo.json
          executor-config: examples/ci/node.json
          report: artifacts/node.json
      - name: Gate a Python application through the same action
        uses: ./
        with:
          cases: evals/ci-echo.json
          executor-config: examples/ci/python.json
          report: artifacts/python.json
      - name: Create a deliberately failing application expectation
        run: python -c "import json,pathlib; p=pathlib.Path('evals/ci-echo.json'); d=json.loads(p.read_text()); d['cases'][1]['expected']['output']='intentional mismatch'; pathlib.Path('artifacts/failing-cases.json').write_text(json.dumps(d))"
      - name: Prove a failed evaluation blocks its action step
        id: rejected
        continue-on-error: true
        uses: ./
        with:
          cases: artifacts/failing-cases.json
          executor-config: examples/ci/node.json
          report: artifacts/rejected.json
      - name: Require the negative gate to have failed
        env:
          GATE_OUTCOME: ${{ steps.rejected.outcome }}
        run: python -c "import os; assert os.environ['GATE_OUTCOME']=='failure'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consumer-gate-reports
          path: artifacts/*
          if-no-files-found: error

  container:
    strategy:
      matrix:
        bedrock: ['false', 'true']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: docker build --build-arg WITH_BEDROCK=${{ matrix.bedrock }} -t agent-tdd:ci .
      - run: python scripts/check_container.py agent-tdd:ci
      - if: matrix.bedrock == 'true'
        run: docker run --rm --read-only --network none --entrypoint python agent-tdd:ci -c "import boto3; assert boto3.__version__ == '1.43.8'"
