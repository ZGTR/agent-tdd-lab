name: Live evaluations
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider (explicit paid inference; never runs on a pull request)
        type: choice
        options: [openai, bedrock]
        required: true
      model:
        description: Candidate model or Bedrock inference-profile ID
        type: string
        required: true
      baseline_model:
        description: Optional baseline model (adds up to 12 more inference requests)
        type: string
        required: false
      region:
        description: Bedrock region
        type: string
        default: us-east-1
permissions:
  contents: read
jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-evaluation
    permissions:
      contents: read
      id-token: write
    env:
      EVAL_PROVIDER: ${{ inputs.provider }}
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_BASELINE_MODEL: ${{ inputs.baseline_model }}
      EVAL_ENDPOINT: ${{ vars.OPENAI_ENDPOINT }}
      EVAL_REGION: ${{ inputs.region }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: inputs.provider == 'bedrock'
        name: Require the configured Bedrock role
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: python -c "import os; assert os.environ.get('ROLE'), 'Configure AWS_ROLE_ARN in live-evaluation'"
      - if: inputs.provider == 'bedrock'
        uses: aws-actions/configure-aws-credentials@557591d3fb8057929645fd3c7147240c3ec8e690
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-session-name: agent-tdd-evaluation
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra bedrock
      - run: uv run --frozen --extra bedrock python scripts/run_live_evaluation.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evaluation-report
          path: |
            artifacts/candidate.json
            artifacts/candidate.html
            artifacts/candidate.xml
            artifacts/baseline.json
            artifacts/baseline.html
            artifacts/baseline.xml
          if-no-files-found: warn
          retention-days: 7
